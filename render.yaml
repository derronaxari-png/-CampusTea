services:
  - type: web
    name: knutsford-campus-tea
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: knutsford-tea-db
          property: connectionString

databases:
  - name: knutsford-tea-db
    plan: basic-256mb
    databaseName: knutsford_tea
    user: knutsford_tea
